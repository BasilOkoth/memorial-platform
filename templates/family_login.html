{% extends "base.html" %}
{% block title %}Family Login · {{ memorial.memorial_name }}{% endblock %}
{% block body %}
<main class="shell narrow">
  <section class="card login-card">
    <p class="eyebrow">Family workspace</p>
    <h1>{{ memorial.memorial_name }}</h1>
    <p>Enter the private password provided when this memorial was created.</p>
    <form method="post" class="form">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <label>Family password<input type="password" name="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary">Open family dashboard</button>
    </form>
    <a class="text-link" href="{{ url_for('public_memorial', slug=memorial.slug) }}">← Back to memorial</a>
  </section>
</main>
{% endblock %}
