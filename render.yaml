services:
  - type: web
    name: memorial-platform
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: PLATFORM_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: memorial-platform-db
          property: connectionString

databases:
  - name: memorial-platform-db
    databaseName: memorial_platform
    user: memorial_platform
